# check -> image -> deploy, like rokomet-stats. See README.md, "Deploy".
# Rollback: run by hand with `tag` = an older sha; that skips check and image.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy this existing image tag (git sha) instead of building"
        required: false

env:
  IMAGE: ghcr.io/grega-rotar/ld-docs
  READER_IMAGE: ghcr.io/grega-rotar/ld-reader
  HEALTH_URL: https://ld-docs.etiam.si/health

jobs:
  check:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tests run inside the real image (same Python, zbar, Pillow).
      - run: docker build -t ld-docs:check .
      - run: |
          docker run --rm -v "$PWD:/src:ro" -w /src --entrypoint sh ld-docs:check -c \
            "pip install -q --user --break-system-packages -r requirements-dev.txt && python3 -m pytest -q -p no:cacheprovider tests --ignore=tests/reader"

  # The local reader (reader/) runs on the GPU machine, not here; its tests use synthetic forms and stub
  # out the vision model, so they run on a plain runner inside the reader image.
  reader:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f reader/Dockerfile -t ld-reader:check .
      - run: |
          docker run --rm -v "$PWD:/src:ro" -w /src -e PYTHONPATH=/src ld-reader:check sh -c \
            "pip install -q --user -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider tests/reader"

  image:
    if: ${{ github.event_name != 'pull_request' && !inputs.tag }}
    needs: [check, reader]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The reader image, for ZPIZ's own VM (deploy/zpiz/). Its own cache scope, so the two builds
      # don't overwrite each other's cache. Not deployed anywhere from here.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: reader/Dockerfile
          push: true
          tags: |
            ${{ env.READER_IMAGE }}:${{ github.sha }}
            ${{ env.READER_IMAGE }}:latest
          cache-from: type=gha,scope=reader
          cache-to: type=gha,mode=max,scope=reader

  deploy:
    if: ${{ github.event_name != 'pull_request' && !cancelled() && !failure() }}
    needs: image
    runs-on: ubuntu-latest
    concurrency: deploy-ld-docs
    env:
      TAG: ${{ inputs.tag || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Copy compose.yml
        run: scp infra/compose.yml deploy@${{ secrets.DEPLOY_HOST }}:/srv/ld-docs/
      - name: Pull and restart
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} "cd /srv/ld-docs && export IMAGE_TAG=$TAG && docker compose pull app && docker compose up -d --remove-orphans"
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "$HEALTH_URL"; then exit 0; fi
            sleep 2
          done
          echo "$HEALTH_URL did not return 200 within 60 s"
          exit 1
