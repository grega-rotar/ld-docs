# Lives in /srv/ld-docs on t4a; the deploy job copies it there (README.md, "Deploy").
name: ld-docs

services:
  app:
    image: ghcr.io/grega-rotar/ld-docs:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env  # API_KEYS (comma-separated); READER_URL + READER_KEY for the local reader; optional CLAUDE_MODEL / MAX_PARALLEL / JOB_TTL_DAYS
    # The server-wide Traefik in /srv/edge routes ld-docs.etiam.si here.
    networks:
      - default
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.ld-docs.rule=Host(`ld-docs.etiam.si`)
      - traefik.http.services.ld-docs.loadbalancer.server.port=8000
    environment:
      CLAUDE_POOL_SERVER_ID: t4a
    volumes:
      - app_data:/data
      - claude_home:/home/app/.claude
      # Same claude-pool accounts as rokomet-stats (copied, mode 600, owned by uid 1000).
      - ./claude-pool:/home/app/.config/claude-pool:ro

networks:
  edge:
    external: true

volumes:
  app_data:
  claude_home:
