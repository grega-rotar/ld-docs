# The local reader on the GPU machine (README "Local reader"). Start: docker compose -f reader/compose.yml up -d --build
# Needs reader/.env with READER_KEYS (comma-separated) and TUNNEL_TOKEN (Cloudflare Tunnel, routes the
# reader's hostname to http://reader:8100). Nothing listens on the machine's own network: the tunnel is
# the only way in.
name: ld-reader

services:
  ollama:
    image: ollama/ollama:0.40.11
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    gpus: all

  # Pulls the vision model once (6 GB), then exits.
  model:
    image: ollama/ollama:0.40.11
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${VLM_MODEL:-qwen3-vl:8b-instruct}"]
    restart: "no"

  reader:
    build:
      context: ..
      dockerfile: reader/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
      VLM_MODEL: ${VLM_MODEL:-qwen3-vl:8b-instruct}
    depends_on:
      ollama:
        condition: service_started
      model:
        condition: service_completed_successfully

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: .env  # TUNNEL_TOKEN
    depends_on: [reader]

volumes:
  ollama:
    name: ollama  # the models (6 GB); a fixed name, so a rebuild or a renamed project keeps them
